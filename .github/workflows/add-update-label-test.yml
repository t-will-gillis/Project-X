name: Install "Add Update Label Weekly"

on:
  workflow_dispatch:

# Set default permissions
permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.INSTALL_WORKFLOW }}
        
      - name: Download example configs if not present
        run: |
          set -euo pipefail
          
          # Base URL for remote files
          REMOTE_BASE="https://github.com/t-will-gillis/maintenance-actions/raw/second-iteration/example-configs"
      
          download_if_missing() {
            local src="$1"
            local dest="$2"
            mkdir -p "$(dirname "$dest")"
            if [ ! -f "$dest" ]; then
              echo "Downloading $src → $dest"
              curl -L "$REMOTE_BASE/$src" -o "$dest"
            else
              echo "Skipping $dest (already exists)"
            fi
          }
      
          download_if_missing "add-update-label-weekly.example.yml" ".github/workflows/add-update-label-weekly.yml"
          download_if_missing "add-update-label-weekly-config.example.yml" ".github/maintenance-actions/add-update-label-weekly-config.yml"
          download_if_missing "label-directory.example.yml" ".github/maintenance-actions/label-directory.yml"

      - name: Commit installed files
        uses: stefanzweifel/git-auto-commit-action@v6.0.1
        with:
          commit_message: "Install Add Update Label Weekly files


          skip-checks: true"
          commit_user_name: "github-actions[bot]"


