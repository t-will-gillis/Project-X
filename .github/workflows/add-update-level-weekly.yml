# AKA "Schedule Friday 0700"
name: Add Update Label Weekly

# CUSTOMIZE: Adjust schedule for your project's needs
on:
  schedule:
    - cron: '0 7 * 1-6,8-11 5'  # Fridays at midnight PDT, excluding July and December
  workflow_dispatch:

permissions:  
  contents: read  
  issues: read

jobs:
  Add-Update-Label-to-Issues-Weekly:
    runs-on: ubuntu-latest
    # CUSTOMIZE: Change to your project repository name
    if: github.repository == 'Project-X/main'
    steps:
      - uses: actions/checkout@v5
      
      - uses: actions/github-script@v8
        with:
          # CUSTOMIZE: Change to your token secret name
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const script = require('./github-actions/add-update-label/add-label.js');
            script({ g: github, c: context });
